<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 시작 홈페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-left">
        <a href="https://www.sdu.ac.kr/" target="_blank" class="sdu-logo-link">
            <span class="sdu-text">SDU</span> 서울디지털대학교
        </a>
    </div>
    <div class="top-right">
        <div id="weather-seoul" class="weather-widget">서울 날씨 로딩 중...</div>
        <div id="weather-jeju" class="weather-widget">제주 날씨 로딩 중...</div>
    </div>

    <main class="container">
        <div class="logo">
            <span class="g-blue">M</span><span class="g-red">y</span>
            <span class="g-yellow">S</span><span class="g-blue">t</span><span class="g-green">a</span><span class="g-red">r</span><span class="g-blue">t</span>
        </div>

        <form class="search-box" action="https://www.google.com/search" method="get" target="_blank">
            <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" name="q" id="search-input" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
        </form>
        <div class="search-buttons">
            <button type="button" id="search-btn">Google 검색</button>
            <button type="button" id="lucky-btn">I'm Feeling Lucky</button>
        </div>

        <div class="quote-box">
            <p id="quote-text"></p>
            <p id="quote-author"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
